{% include base_path %}

<script>
  (function () {
    const savedTheme = localStorage.getItem("theme");
    const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
    const theme = savedTheme || "dark";
    document.documentElement.setAttribute("data-theme", theme);
  })();
</script>

<style>
  html[data-theme="dark"] {
    color-scheme: dark;
    --global-bg-color: #1f1f20;
    --global-base-color: #3a3a3c;
    --global-border-color: #3a3a3c;
    --global-code-background-color: #2a2a2c;
    --global-code-text-color: #e8e8e8;
    --global-fig-caption-color: #b8b8ba;
    --global-link-color: #2896ba;
    --global-link-color-hover: #54b3d1;
    --global-link-color-visited: #72b4cb;
    --global-accent-color: #ce9540;
    --global-masthead-link-color: #e8e8e8;
    --global-masthead-link-color-hover: #b8b8ba;
    --global-text-color: #e8e8e8;
    --global-text-color-light: #b8b8ba;
    --global-thead-color: #29292b;
  }

  html[data-theme="light"] {
    color-scheme: light;
    --global-bg-color: #ffffff;
    --global-base-color: #72787e;
    --global-border-color: #e2e2e4;
    --global-code-background-color: #f5f5f6;
    --global-code-text-color: #1f1f20;
    --global-fig-caption-color: #606064;
    --global-link-color: #167a9e;
    --global-link-color-hover: #0d5873;
    --global-link-color-visited: #526b78;
    --global-accent-color: #9a641f;
    --global-masthead-link-color: #1f1f20;
    --global-masthead-link-color-hover: #606064;
    --global-text-color: #1f1f20;
    --global-text-color-light: #606064;
    --global-thead-color: #f4f4f5;
  }

  html, body {
    transition: background-color 0.25s ease, color 0.25s ease;
  }

  #theme-toggle {
    margin-left: 1rem;
    padding: 0.35rem 0.75rem;
    border: 1px solid var(--global-border-color);
    border-radius: 999px;
    background: transparent;
    color: var(--global-masthead-link-color);
    font-size: 0.9rem;
    cursor: pointer;
    white-space: nowrap;
  }

  #theme-toggle:hover {
    color: var(--global-masthead-link-color-hover);
    border-color: var(--global-masthead-link-color-hover);
  }
</style>

<script>
  document.addEventListener("DOMContentLoaded", function () {
    const nav = document.querySelector("#site-nav .visible-links");
    if (!nav) return;

    if (!document.getElementById("theme-toggle")) {
      const li = document.createElement("li");
      li.className = "masthead__menu-item";

      const button = document.createElement("button");
      button.id = "theme-toggle";
      button.type = "button";
      button.setAttribute("aria-label", "Cambiar tema");

      function updateButton(theme) {
        button.textContent = theme === "dark" ? "☀️" : "🌙";
      }

      let currentTheme = document.documentElement.getAttribute("data-theme") || "dark";
      updateButton(currentTheme);

      button.addEventListener("click", function () {
        currentTheme = currentTheme === "dark" ? "light" : "dark";
        document.documentElement.setAttribute("data-theme", currentTheme);
        localStorage.setItem("theme", currentTheme);
        updateButton(currentTheme);
      });

      li.appendChild(button);
      nav.appendChild(li);
    }
  });
</script>
